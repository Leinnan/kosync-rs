[package]
name = "kosync_rs"
version = "0.1.0"
edition = "2024"

[features]
# Re-read templates from KOSYNC_RS_TEMPLATE_DIR when they change, for development.
reload = ["web_mev_templates/reload"]

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "derive", "migrate"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
md-5 = "0.10"
tracing = "0.1"
tera = "2"
include_dir = "0.7"
tower-cookies = "0.11"
time = { version = "0.3", features = ["formatting"] }
epub = { version = "2.1.5", default-features = false }
boko = { version = "0.6.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
quick-xml = "0.41.0"
base64 = "0.23.1"
serde_json = "1"
mime_guess = "2.0.5"
tokio-util = { version = "0.7.19", features = ["io"] }
zip = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "charset"] }
web_mev_core = { git = "https://github.com/Leinnan/web_mev_toolkit", rev = "b563b96c187df78089b37bc75a5fcfc59e85101a" }
web_mev_runtime = { git = "https://github.com/Leinnan/web_mev_toolkit", rev = "b563b96c187df78089b37bc75a5fcfc59e85101a" }
web_mev_sqlite = { git = "https://github.com/Leinnan/web_mev_toolkit", rev = "b563b96c187df78089b37bc75a5fcfc59e85101a" }
web_mev_axum = { git = "https://github.com/Leinnan/web_mev_toolkit", rev = "b563b96c187df78089b37bc75a5fcfc59e85101a" }
web_mev_templates = { git = "https://github.com/Leinnan/web_mev_toolkit", rev = "b563b96c187df78089b37bc75a5fcfc59e85101a" }
web_mev_auth = { git = "https://github.com/Leinnan/web_mev_toolkit", rev = "b563b96c187df78089b37bc75a5fcfc59e85101a" }
web_mev_i18n = { git = "https://github.com/Leinnan/web_mev_toolkit", rev = "b563b96c187df78089b37bc75a5fcfc59e85101a" }
web_mev_assets = { git = "https://github.com/Leinnan/web_mev_toolkit", rev = "b563b96c187df78089b37bc75a5fcfc59e85101a", features = ["axum"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
md-5 = "0.10"
quick-xml = "0.41.0"
