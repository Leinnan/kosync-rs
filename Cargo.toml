[workspace]
members = [ "kosync_rs" ]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0
strip = "debuginfo"
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16

[profile.release.package."*"]
opt-level = "s"

# Shipping profile: abort on panic for a smaller binary. Do not build tests
# with this profile: the test harness requires unwinding.
[profile.dist]
inherits = "release"
panic = "abort"

[workspace.lints.clippy.pedantic]
level = "deny"
priority = 1

[workspace.lints.clippy.perf]
level = "warn"
priority = 8

[workspace.lints.clippy.style]
level = "warn"
priority = 9

[workspace.lints.clippy.unwrap_used]
level = "deny"
priority = 10

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
